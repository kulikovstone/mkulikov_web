name: Deploy website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Сборка и публикация одной версии завершаются до запуска следующей.
concurrency:
  group: mkulikov-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployment scripts
        run: |
          bash -n deploy/publish.sh deploy/setup-server.sh deploy/enable-https.sh
          python3 -m unittest discover -s tests -v

      - name: Build
        run: npm run build

      - name: Publish to VDS
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 136.234.5.71
          DEPLOY_USER: mkulikov-web-deploy
        run: bash deploy/publish.sh
